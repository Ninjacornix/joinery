# The shared game core, applied with every blueprint before it.
# Overlay roots: core/, tests/support/, default_bus_layout.tres.
id = "_core"
kind = "core"
name = "Game core"
version = 1

# Order matters: later autoloads may use earlier ones in _ready.
# Replays comes first: it seeds the random generator before anything else runs.
[autoload]
Replays = "res://core/replays/replays.gd"
Settings = "res://core/settings.gd"
GameEvents = "res://core/game_events.gd"
Menus = "res://core/menus.gd"
Game = "res://core/game.gd"
Music = "res://core/audio/music.gd"
UiSounds = "res://core/audio/ui_sounds.gd"
BugReports = "res://core/replays/bug_reports.gd"

[project.settings]
"audio/buses/default_bus_layout" = "res://default_bus_layout.tres"
# Exported release builds record play only when the game opts in (bug reports then
# carry a replay). Debug builds always record.
"game/replays/record_in_release" = false

[input.pause]
keys = ["Escape", "P"]

[input.report_bug]
keys = ["F8"]
