id = "save-load"
name = "Save and load"
summary = "Three save slots and an autosave at checkpoints, with Continue, Save and Load in the menus."
version = 1
requires = []
conflicts = []
enhances = ["online-play"]
blueprints = ["*"]
extra_roots = []

# Saves live in `save/directory` as slot_<n>.json (slot 0 is the autosave).
# Raise `save/data_version` when saved state changes shape and register a
# step in res://game/save_migrations.gd (`func migrations() -> Dictionary`,
# {old_version: Callable}) or with `SaveGame.add_migration`; older slots are
# upgraded on load. `joinery saves` keeps saves from playtests and checks every
# change that touches saved state still loads them (ADR 0066).
[project.settings]
"save/directory" = "user://saves"
"save/data_version" = 1
"save/autosave_on_checkpoint" = true
"save/autosave_min_interval" = 10.0

[autoload]
SaveGame = "res://features/save-load/save_game.gd"
