name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Build and exercise the three native editors
        type: boolean
        default: true
  workflow_call:
    inputs:
      native:
        description: Release callers run their native matrix separately
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secrets:
    # Scan every commit for credentials and private keys with the rules in
    # .gitleaks.toml. The release binary is pinned and checked against the
    # SHA-256 published in the v8.30.1 checksums file.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install the pinned gitleaks release
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Scan the full history
        run: |
          mkdir -p out
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --redact --no-banner \
            --exit-code 1 --report-format json --report-path out/gitleaks.json
      - name: Retain the redacted report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: out/gitleaks.json
          if-no-files-found: ignore

  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Enable real Windows checkout symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: uv sync --frozen --python 3.12
      - name: Install the pinned native provider without install scripts
        run: npm install --global --ignore-scripts @openai/codex@0.167.0
      - name: Exercise real provider startup and cancellation without authentication
        run: uv run python release/provider_smoke.py --output out/provider-smoke.json
      - run: uv run ruff check .
      - run: uv run mypy joinery servers bridge release
      - run: uv run pytest --junitxml=out/unit-results.xml
      - run: uv run joinery check all
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-results-${{ matrix.os }}
          path: |
            out/unit-results.xml
            out/provider-smoke.json
          if-no-files-found: ignore

  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --python 3.12
      # Use committed measured digests: never silently trust a changed download.
      - name: Build pinned offline creative workers
        run: |
          sandbox/build.sh --with blender --with supercollider --with krita --with inkscape --with materialmaker --with gimp --tag joinery-sandbox-runtime
          docker build --platform linux/amd64 -t joinery-mcp-worker -f sandbox/mcp.Dockerfile sandbox
          docker build --platform linux/amd64 -t joinery-creative-worker -f sandbox/creative.Dockerfile sandbox
      - name: Install and probe the pinned Godot MCP in the offline worker
        run: |
          uv run joinery new out/mcp-check --name "Worker MCP check" --tools godot
          uv run joinery mcp install --project out/mcp-check --tool godot
          uv run joinery mcp status --project out/mcp-check --probe > out/mcp-status.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          servers = json.loads(Path('out/mcp-status.json').read_text())['servers']
          (godot,) = [item for item in servers if item['name'] == 'godot']
          assert godot['state'] == 'discovered' and godot['inspected'], godot
          print(godot['summary'])
          PY
      - name: Stage, review, reject and accept Godot scene edits through the worker MCP
        run: uv run python tests/integration/mcp_round_trip.py
      - name: A reviewer reads the staged change through a read-only worker view
        run: uv run python tests/integration/review_view.py
      - name: Create, edit and replay a Surge XT sound in the offline worker
        run: uv run python tests/integration/surge_native.py
      - name: Create, edit one layer of and replay a GIMP image in the offline worker
        run: uv run python tests/integration/gimp_native.py
      - name: Render, edit and replay MIDI music through FluidSynth and Surge XT
        run: uv run python tests/integration/midi_render.py
      - name: Trim, fade, level and loop rendered audio through joinery-sound
        run: uv run python tests/integration/audio_edits.py
      - name: Check SuperCollider offline renders fail fast
        run: uv run python tests/integration/supercollider_native.py nrt
      - name: Feed a recorded image into a Material Maker graph
        run: uv run python tests/integration/materialmaker_parts.py
      - name: Rig an MPFB2 human with Rigify and export deform bones only
        run: uv run python tests/integration/blender_rig.py
      - name: Check measured testbed assets
        run: |
          uv run joinery lock --project testbed
          git diff --exit-code -- testbed/joinery.lock
          uv run joinery check assets --project testbed
      - name: Rebuild committed recipes in an isolated copy
        run: uv run joinery rebuild --project testbed --runner sandbox
      - name: Exercise real creative edits, replay and review lifecycle
        run: uv run python tests/integration/creative_updates.py
      - name: Measure reused workers and exercise native cancellation
        run: uv run python tests/integration/assistant_latency.py --all-native
      - name: Retain native worker performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: creative-worker-latency
          path: out/assistant-latency.json
          if-no-files-found: warn

  native:
    # Called workflows retain the caller event name. Test the actual input so
    # release push runs can disable this duplicate matrix too.
    if: ${{ toJSON(inputs.native) != 'false' }}
    uses: ./.github/workflows/native.yml
