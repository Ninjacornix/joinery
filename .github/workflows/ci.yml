name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Build and exercise the three native editors
        type: boolean
        default: true
  workflow_call:
    inputs:
      native:
        description: Release callers run their native matrix separately
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Enable real Windows checkout symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: uv sync --frozen --python 3.12
      - name: Install the pinned native provider without install scripts
        run: npm install --global --ignore-scripts @openai/codex@0.167.0
      - name: Exercise real provider startup and cancellation without authentication
        run: uv run python release/provider_smoke.py --output out/provider-smoke.json
      - run: uv run ruff check .
      - run: uv run mypy joinery servers bridge release
      - run: uv run pytest --junitxml=out/unit-results.xml
      - run: uv run joinery check all
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-results-${{ matrix.os }}
          path: |
            out/unit-results.xml
            out/provider-smoke.json
          if-no-files-found: ignore

  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --python 3.12
      # Use committed measured digests: never silently trust a changed download.
      - name: Build pinned offline creative workers
        run: |
          sandbox/build.sh --with blender --with supercollider --with krita --with inkscape --with materialmaker --tag joinery-sandbox-runtime
          docker build --platform linux/amd64 -t joinery-mcp-worker -f sandbox/mcp.Dockerfile sandbox
          docker build --platform linux/amd64 -t joinery-creative-worker -f sandbox/creative.Dockerfile sandbox
      - name: Check measured testbed assets
        run: |
          uv run joinery lock --project testbed
          git diff --exit-code -- testbed/joinery.lock
          uv run joinery check assets --project testbed
      - name: Rebuild committed recipes in an isolated copy
        run: uv run joinery rebuild --project testbed --runner sandbox
      - name: Exercise real creative edits, replay and review lifecycle
        run: uv run python tests/integration/creative_updates.py

  native:
    # Called workflows retain the caller event name. Test the actual input so
    # release push runs can disable this duplicate matrix too.
    if: ${{ toJSON(inputs.native) != 'false' }}
    uses: ./.github/workflows/native.yml
