name: Windows native validation

on:
  push:
    branches: [release/windows-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      native: false
  windows:
    uses: ./.github/workflows/native.yml
    with:
      editors: '{"include":[{"os":"windows-2025","target":"windows-x86_64","archive":"zip","jobs":4}]}'
      runtimes: false
