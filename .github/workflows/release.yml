name: Desktop alpha release

on:
  push:
    branches: [release/desktop-alpha]
    tags: [v0.1.0-alpha.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      native: false
  native:
    uses: ./.github/workflows/native.yml
  publish:
    needs: [checks, native]
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0-alpha.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: joinery-desktop-*
          merge-multiple: true
          path: out/release
      - name: Verify complete candidate set and archive digests
        working-directory: out/release
        run: |
          test -f Joinery-0.1.0-alpha.1-macos-arm64.zip
          test -f Joinery-0.1.0-alpha.1-linux-x86_64.tar.gz
          test -f Joinery-0.1.0-alpha.1-windows-x86_64.zip
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 3
          sha256sum --check ./*.sha256
      - name: Publish the gated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          First desktop alpha: macOS ARM64, Linux x86_64, and Windows x86_64.

          Download your platform archive and its SHA-256 checksum. Install uv and your supported agent CLI separately; connect your own subscription or API profile on first launch.

          These are unsigned and not notarized alpha builds. macOS may require approval in Privacy & Security; Windows SmartScreen may flag an unknown publisher. Windows alpha chat supports Codex; other native provider sandboxes are not yet supported. Creative tool workers require Docker with Linux containers.

          All desktop builds, isolated bundle checks, native editor review/undo tests, offline creative lifecycle checks, and exported runtime smoke tests passed in this workflow. Game exports are technical test artifacts rather than a bundled example game.
          NOTES
          printf '\nBuild logs and native screenshots: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" out/release/* --verify-tag --prerelease --title "Joinery 0.1.0 Alpha 1" --notes-file "$RUNNER_TEMP/release-notes.md"
