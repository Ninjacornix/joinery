name: Native desktop gates

on:
  # Run one platform by hand, e.g.:
  # gh workflow run native.yml -f editors='{"include":[{"os":"windows-2025","target":"windows-x86_64","archive":"zip","jobs":4}]}' -f runtimes=false
  workflow_dispatch:
    inputs:
      editors:
        description: Native editor matrix (JSON)
        type: string
        default: '{"include":[{"os":"macos-15","target":"macos-arm64","archive":"zip","jobs":2},{"os":"ubuntu-24.04","target":"linux-x86_64","archive":"tar.gz","jobs":4},{"os":"windows-2025","target":"windows-x86_64","archive":"zip","jobs":4}]}'
      runtimes:
        description: Download and run the three portable game exports
        type: boolean
        default: false
      combo_matrix:
        description: Blueprint and feature combinations to boot
        type: string
        default: default
      classic_passes:
        description: How many times to run the classic view check (to catch a rare failure)
        type: string
        default: '1'
  workflow_call:
    inputs:
      editors:
        description: Native editor matrix; release callers use the full default
        type: string
        default: '{"include":[{"os":"macos-15","target":"macos-arm64","archive":"zip","jobs":2},{"os":"ubuntu-24.04","target":"linux-x86_64","archive":"tar.gz","jobs":4},{"os":"windows-2025","target":"windows-x86_64","archive":"zip","jobs":4}]}'
      runtimes:
        description: Download and run the three portable game exports
        type: boolean
        default: true
      combo_matrix:
        description: Blueprint and feature combinations to boot ("default" samples, "full" boots every one)
        type: string
        default: default

permissions:
  contents: read

jobs:
  editor:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.editors) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      JOINERY_CAPTURE_DIR: ${{ github.workspace }}/out/native-evidence
      JOINERY_SERVER_CACHE: ${{ github.workspace }}/out/ci-servers
    steps:
      - name: Enable real Windows checkout symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Activate native MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - run: uv sync --frozen --python 3.12
      - name: Install Linux compiler and native display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev xvfb xauth bubblewrap libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Select the native Linux software Vulkan driver
        if: runner.os == 'Linux'
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          candidates = sorted(Path('/usr/share/vulkan/icd.d').glob('lvp_icd*.json'))
          selected = [path for path in candidates if 'x86_64' in path.name]
          selected = selected or [path for path in candidates if path.name == 'lvp_icd.json']
          selected = selected or candidates
          assert len(selected) == 1, f'Expected one native Lavapipe ICD, found {candidates}'
          runtime = Path(os.environ['RUNNER_TEMP']) / 'joinery-graphics-runtime'
          runtime.mkdir(mode=0o700, exist_ok=True)
          runtime.chmod(0o700)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as destination:
              destination.write(f'VK_DRIVER_FILES={selected[0]}\nVK_ICD_FILENAMES={selected[0]}\nXDG_RUNTIME_DIR={runtime}\n')
          PY
      - name: Prove software Vulkan presentation support before the cold build
        if: runner.os == 'Linux'
        run: |
          mkdir -p out/native-evidence
          xvfb-run -a vulkaninfo --summary 2>&1 | tee out/native-evidence/vulkan-summary.log
          uv run python - <<'PY'
          from pathlib import Path
          text = Path('out/native-evidence/vulkan-summary.log').read_text(encoding='utf-8')
          assert 'VK_KHR_surface' in text, 'Software Vulkan must provide presentation extensions'
          assert any(name in text.lower() for name in ('llvmpipe', 'lavapipe')), 'Expected the Mesa CPU Vulkan driver'
          assert 'ERROR' not in text, 'Software Vulkan preflight reported an error'
          PY
      - name: Restore native compiler cache
        id: compiler_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/joinery/scons
          key: scons-${{ matrix.target }}-${{ hashFiles('godot_patches/UPSTREAM', 'godot_patches/patches/*.patch', 'release/build_editor.py', 'release/windows_build_deps.py', 'release/macos_build_deps.py') }}
          restore-keys: scons-${{ matrix.target }}-
      - name: Build and measure the pinned patched native editor
        id: native_build
        # Windows also writes the editor's .pdb (never packaged) so crash dumps read as stacks.
        run: uv run python release/build_editor.py --jobs ${{ matrix.jobs }} --github-env "$GITHUB_ENV" ${{ runner.os == 'Windows' && '--debug-symbols' || '' }}
      - name: Provision private Windows software OpenGL
        if: runner.os == 'Windows'
        run: uv run python release/windows_graphics.py --engine "$JOINERY_RELEASE_ENGINE" --output out/windows-software-gl --cache "$RUNNER_TEMP/mesa" --github-env "$GITHUB_ENV"
      - name: Trace fail-fast exits in every later Windows editor
        if: runner.os == 'Windows'
        # abort() and friends end with 0xC0000409 and no report; the fork prints
        # their stack instead (ADR 0032). Prove it once, then keep it on.
        run: |
          uv run python - <<'PY'
          import os
          import subprocess
          result = subprocess.run(
              [os.environ['JOINERY_GODOT_BIN'], '--version'],
              env={**os.environ, 'JOINERY_CRASH_TRACE': 'selftest'},
              capture_output=True, text=True, errors='replace', timeout=300, check=False,
          )
          print(result.stdout + result.stderr)
          assert result.returncode == 0xE04A0001, f'exit 0x{result.returncode & 0xFFFFFFFF:08X}'
          assert 'JOINERY CRASH TRACE: abort' in result.stderr
          # Names, not always lines: a cached build can lose its line records.
          assert '.exe+0x' in result.stderr and ' main' in result.stderr, 'the trace must resolve symbols'
          PY
          echo "JOINERY_CRASH_TRACE=1" >> "$GITHUB_ENV"
      - name: Keep a full crash dump whenever the Windows editor crashes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumps = Join-Path $env:GITHUB_WORKSPACE 'out\crash-dumps'
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
          foreach ($path in $wer, $policy) {
            if (-not (Test-Path $path)) { New-Item -Force $path | Out-Null }
            New-ItemProperty $path -Name Disabled -Value 0 -PropertyType DWord -Force | Out-Null
            New-ItemProperty $path -Name DontShowUI -Value 1 -PropertyType DWord -Force | Out-Null
          }
          # A crash reports through WER only while consent allows it and no queue holds it back.
          New-ItemProperty $wer -Name DisableQueue -Value 1 -PropertyType DWord -Force | Out-Null
          $consent = "$wer\Consent"
          if (-not (Test-Path $consent)) { New-Item -Force $consent | Out-Null }
          New-ItemProperty $consent -Name DefaultConsent -Value 1 -PropertyType DWord -Force | Out-Null
          $key = Join-Path "$wer\LocalDumps" (Split-Path $env:JOINERY_RELEASE_ENGINE -Leaf)
          New-Item -Force $key | Out-Null
          New-ItemProperty $key -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty $key -Name DumpCount -Value 5 -PropertyType DWord -Force | Out-Null
          Set-Service WerSvc -StartupType Manual -ErrorAction SilentlyContinue
          Start-Service WerSvc -ErrorAction SilentlyContinue
          Get-ItemProperty $key | Format-List DumpFolder, DumpType, DumpCount
          Get-Service WerSvc | Format-List Name, Status, StartType
          # Also a postmortem debugger, for crashes WER lets through without a dump.
          try {
            $procdump = Join-Path $env:RUNNER_TEMP 'procdump'
            New-Item -ItemType Directory -Force (Join-Path $dumps 'postmortem') | Out-Null
            Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile "$procdump.zip"
            Expand-Archive "$procdump.zip" $procdump -Force
            & "$procdump\procdump64.exe" -accepteula -ma -i (Join-Path $dumps 'postmortem')
          } catch { "procdump unavailable: $_" }
      - name: Lint native addon
        # The glob takes in every addon script, the part picker, parts panel
        # and sidebar pieces included; tests/godot holds their GDScript tests.
        run: uvx --from gdtoolkit==4.5.0 gdlint godot_addon/joinery/*.gd tests/godot
      - name: Lint blueprint and feature game code, the playtest bot and the blockout level
        run: uvx --from gdtoolkit==4.5.0 gdlint blueprints features joinery/playtest_bot joinery/blockout tests/fixtures/playtest_game tests/fixtures/blockout
      - name: Play every blueprint and feature in the built engine
        if: runner.os != 'Windows'
        env:
          JOINERY_COMBO_MATRIX: ${{ inputs.combo_matrix == 'full' && 'full' || '' }}
        run: |
          mkdir -p out/native-evidence
          JOINERY_TEST_GODOT="$JOINERY_RELEASE_ENGINE" uv run pytest tests/blueprints tests/test_blueprints.py tests/test_capture_blueprints.py --junitxml=out/native-evidence/blueprints.xml
      - name: Boot the blueprint matrix and keep its report
        if: runner.os == 'Linux'
        run: |
          mkdir -p out/matrix
          JOINERY_TEST_GODOT="$JOINERY_RELEASE_ENGINE" JOINERY_BLUEPRINT_MATRIX=1 JOINERY_MATRIX_REPORT=out/matrix uv run pytest tests/test_blueprint_matrix.py -m blueprint_matrix
      - name: Upload the blueprint matrix report
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blueprint-matrix
          path: out/matrix/matrix.md
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise native controls and real chat pipes
        run: uv run python tests/godot/run_widget_tests.py | tee out/widget-tests.log
      - name: Exercise the Project apps dialog and the app rail
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a uv run python tests/godot/run_setup_tests.py | tee out/setup-tests.log
          else
            uv run python tests/godot/run_setup_tests.py | tee out/setup-tests.log
          fi
      - name: Install the pinned provider for the local API startup fixture
        run: npm install --global --ignore-scripts @openai/codex@0.167.0
      - name: Exercise isolated connection, API and project creation flow
        run: |
          mkdir -p out/native-evidence
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a uv run python tests/godot/run_startup_test.py
          else
            uv run python tests/godot/run_startup_test.py
          fi
      - name: Exercise real graphical editor, review and undo
        run: |
          mkdir -p out/native-evidence
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a uv run python tests/godot/run_scene_edit_test.py | tee out/native-evidence/editor.log
          else
            uv run python tests/godot/run_scene_edit_test.py | tee out/native-evidence/editor.log
          fi
      - name: Switch between Joinery's layout and classic Godot
        env:
          # Repeat by hand to catch an intermittent failure; every pass must succeed.
          CLASSIC_PASSES: ${{ inputs.classic_passes || '1' }}
        run: |
          failed=0
          for pass in $(seq 1 "$CLASSIC_PASSES"); do
            out=out/classic-view
            [ "$CLASSIC_PASSES" = 1 ] || out="out/classic-view/pass-$pass"
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a uv run python tests/godot/run_classic_view_test.py --out "$out" || failed=$((failed + 1))
            else
              uv run python tests/godot/run_classic_view_test.py --out "$out" || failed=$((failed + 1))
            fi
          done
          echo "Classic view: $failed of $CLASSIC_PASSES passes failed"
          [ "$failed" = 0 ]
      - name: Capture responsive assistant controls in both themes
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a uv run python tests/godot/run_assistant_ui_test.py | tee out/native-evidence/assistant-ui.log
          else
            uv run python tests/godot/run_assistant_ui_test.py | tee out/native-evidence/assistant-ui.log
          fi
      - name: Require retained framebuffers and the Windows software renderer
        run: |
          uv run python - <<'PY'
          import os
          import struct
          from pathlib import Path
          evidence = Path(os.environ['JOINERY_CAPTURE_DIR'])
          captures = list(evidence.glob('*.png'))
          assert len(captures) >= 3, 'The native harness must retain at least three framebuffers'
          for capture in captures:
              data = capture.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', capture
              assert min(struct.unpack('>II', data[16:24])) > 0, capture
          if os.name == 'nt':
              assert 'llvmpipe' in (evidence / 'editor.log').read_text(encoding='utf-8').lower(), 'Windows must exercise the private Mesa renderer'
          PY
      - name: Report the Godot MCP's offline worker honestly on the native host
        # The pinned Godot MCP runs in joinery-mcp-worker, never on the host.
        # These runners do not build the worker images (ci.yml's assets job
        # builds them and probes the server there), so install and status must
        # say so plainly instead of falling back to a host server.
        run: |
          uv run joinery new out/mcp-check --name "Native MCP check" --tools godot
          if uv run joinery mcp install --project out/mcp-check --tool godot > out/native-evidence/mcp-install.json; then
            echo "The Godot MCP installed without its worker image" >&2
            exit 1
          fi
          cat out/native-evidence/mcp-install.json
          uv run joinery mcp status --project out/mcp-check --probe > out/native-evidence/mcp.json || true
          cat out/native-evidence/mcp.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          evidence = Path('out/native-evidence')
          error = json.loads((evidence / 'mcp-install.json').read_text(encoding='utf-8'))['error']
          assert error.startswith('Needs Docker') or 'is not built' in error, error
          servers = json.loads((evidence / 'mcp.json').read_text(encoding='utf-8'))['servers']
          (godot,) = [item for item in servers if item['name'] == 'godot']
          assert godot['state'] == 'not-installed', godot
          assert godot['summary'].startswith('Godot tools: not installed. Rebuild the worker.'), godot
          print('Godot MCP without its worker:', error, '/', godot['summary'])
          PY
      - name: Read the release version
        id: release_version
        # Same script as release.yml: maps the package version (0.2.0, 0.2.0a1)
        # to its tag form (0.2.0, 0.2.0-alpha.1) and checks a pushed tag.
        run: |
          uv run python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          match = re.fullmatch(r'(\d+\.\d+\.\d+)(?:(a|b|rc)(\d+))?', version)
          if match is None:
              raise SystemExit(f'pyproject.toml version {version!r} is not a release version (X.Y.Z with an optional aN, bN or rcN)')
          release, stage, number = match.groups()
          stages = {'a': 'alpha', 'b': 'beta', 'rc': 'rc'}
          tag_version = release if stage is None else f'{release}-{stages[stage]}.{number}'
          if os.environ.get('GITHUB_REF_TYPE') == 'tag' and os.environ.get('GITHUB_REF_NAME') != f'v{tag_version}':
              raise SystemExit(f"Tag {os.environ.get('GITHUB_REF_NAME')} does not match package version {version} (expected v{tag_version})")
          lines = f'version={tag_version}\nprerelease={str(stage is not None).lower()}\n'
          if 'GITHUB_OUTPUT' in os.environ:
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
                  output.write(lines)
          print(lines, end='')
          PY
      - name: Package the measured editor without CI graphics DLLs
        env:
          JOINERY_ARCHIVE: out/packages/Joinery-${{ steps.release_version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
        run: |
          uv run joinery package --desktop --binary "$JOINERY_RELEASE_ENGINE" --target "${{ matrix.target }}" --output "$JOINERY_ARCHIVE"
          uv run python release/verify_bundle.py "$JOINERY_ARCHIVE" | tee out/native-evidence/bundle.json
      - name: Export the portable fixture for all desktop runtimes once
        if: runner.os == 'macOS'
        run: uv run python release/export_smoke.py --output out/game-exports --cache "$RUNNER_TEMP/export-templates"
      - name: Upload desktop release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joinery-desktop-${{ matrix.target }}
          path: out/packages/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload portable game exports
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joinery-game-exports
          path: out/game-exports/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Print the stack of every Windows editor crash
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          # The faulting module and offset of each crash, even when no dump was written.
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001, 1005 } -MaxEvents 20 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'godot' } |
            ForEach-Object { "---- $($_.TimeCreated) event $($_.Id)"; $_.Message } |
            Tee-Object -FilePath out\crash-dumps\events.txt
          $dumps = @(Get-ChildItem out\crash-dumps -Recurse -Filter *.dmp -ErrorAction SilentlyContinue)
          if (-not $dumps) { Get-ChildItem C:\ProgramData\Microsoft\Windows\WER -Recurse -Filter *.dmp -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName } }
          if (-not $dumps) { 'No editor crash dumps.'; exit 0 }
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue
          if (-not $cdb) {
            $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits', 'C:\Program Files\Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          }
          if (-not $cdb) { 'cdb.exe is not installed; the dumps are uploaded unread.'; exit 0 }
          $bin = Split-Path $env:JOINERY_RELEASE_ENGINE
          $symbols = "$bin;srv*$env:RUNNER_TEMP\symbols*https://msdl.microsoft.com/download/symbols"
          foreach ($dump in $dumps) {
            "::group::$($dump.Name)"
            & $cdb.FullName -z $dump.FullName -y $symbols -i $bin -lines -c '.symfix+; .reload; .ecxr; kn 80; !analyze -v; ~*kn 40; lmv m godot*; lm; q' 2>&1 |
              Tee-Object -FilePath "out\crash-dumps\$($dump.BaseName).txt"
            '::endgroup::'
          }
      - name: Retain Windows crash dumps and the editor's symbols
        if: ${{ always() && runner.os == 'Windows' && hashFiles('out/crash-dumps/**/*.dmp') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joinery-crash-dumps-${{ matrix.target }}
          path: |
            out/crash-dumps/
            godot_patches/godot-src/bin/*.pdb
          retention-days: 7
      - name: Retain native logs and checked framebuffer captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joinery-native-evidence-${{ matrix.target }}
          path: |
            out/build-engine.json
            out/widget-tests.log
            out/native-evidence/
            out/classic-view/
            out/crash-dumps/*.txt
            out/windows-software-gl/mesa-ci.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save successful compiler work even if a later gate failed
        if: ${{ always() && steps.native_build.outcome == 'success' && steps.compiler_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/joinery/scons
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}

  runtime:
    needs: editor
    if: ${{ inputs.runtimes }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --python 3.12
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: joinery-game-exports
          path: out/game-exports
      - name: Run the exported scene on its native operating system
        run: uv run python release/export_smoke.py --output out/game-exports --smoke-only
