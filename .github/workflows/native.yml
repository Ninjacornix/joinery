name: Native desktop gates

on:
  workflow_call:
    inputs:
      editors:
        description: Native editor matrix; release callers use the full default
        type: string
        default: '{"include":[{"os":"macos-15","target":"macos-arm64","archive":"zip","jobs":2},{"os":"ubuntu-24.04","target":"linux-x86_64","archive":"tar.gz","jobs":4},{"os":"windows-2025","target":"windows-x86_64","archive":"zip","jobs":4}]}'
      runtimes:
        description: Download and run the three portable game exports
        type: boolean
        default: true
      combo_matrix:
        description: Blueprint and feature combinations to boot ("default" samples, "full" boots every one)
        type: string
        default: default

permissions:
  contents: read

jobs:
  editor:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.editors) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      JOINERY_CAPTURE_DIR: ${{ github.workspace }}/out/native-evidence
      JOINERY_SERVER_CACHE: ${{ github.workspace }}/out/ci-servers
    steps:
      - name: Enable real Windows checkout symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Activate native MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - run: uv sync --frozen --python 3.12
      - name: Install Linux compiler and native display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev xvfb xauth bubblewrap libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Select the native Linux software Vulkan driver
        if: runner.os == 'Linux'
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          candidates = sorted(Path('/usr/share/vulkan/icd.d').glob('lvp_icd*.json'))
          selected = [path for path in candidates if 'x86_64' in path.name]
          selected = selected or [path for path in candidates if path.name == 'lvp_icd.json']
          selected = selected or candidates
          assert len(selected) == 1, f'Expected one native Lavapipe ICD, found {candidates}'
          runtime = Path(os.environ['RUNNER_TEMP']) / 'joinery-graphics-runtime'
          runtime.mkdir(mode=0o700, exist_ok=True)
          runtime.chmod(0o700)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as destination:
              destination.write(f'VK_DRIVER_FILES={selected[0]}\nVK_ICD_FILENAMES={selected[0]}\nXDG_RUNTIME_DIR={runtime}\n')
          PY
      - name: Prove software Vulkan presentation support before the cold build
        if: runner.os == 'Linux'
        run: |
          mkdir -p out/native-evidence
          xvfb-run -a vulkaninfo --summary 2>&1 | tee out/native-evidence/vulkan-summary.log
          uv run python - <<'PY'
          from pathlib import Path
          text = Path('out/native-evidence/vulkan-summary.log').read_text(encoding='utf-8')
          assert 'VK_KHR_surface' in text, 'Software Vulkan must provide presentation extensions'
          assert any(name in text.lower() for name in ('llvmpipe', 'lavapipe')), 'Expected the Mesa CPU Vulkan driver'
          assert 'ERROR' not in text, 'Software Vulkan preflight reported an error'
          PY
      - name: Restore native compiler cache
        id: compiler_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/joinery/scons
          key: scons-${{ matrix.target }}-${{ hashFiles('godot_patches/UPSTREAM', 'godot_patches/patches/*.patch', 'release/build_editor.py', 'release/windows_build_deps.py', 'release/macos_build_deps.py') }}
          restore-keys: scons-${{ matrix.target }}-
      - name: Build and measure the pinned patched native editor
        id: native_build
        run: uv run python release/build_editor.py --jobs ${{ matrix.jobs }} --github-env "$GITHUB_ENV"
      - name: Provision private Windows software OpenGL
        if: runner.os == 'Windows'
        run: uv run python release/windows_graphics.py --engine "$JOINERY_RELEASE_ENGINE" --output out/windows-software-gl --cache "$RUNNER_TEMP/mesa" --github-env "$GITHUB_ENV"
      - name: Lint native addon
        # The glob takes in every addon script, the part picker, parts panel
        # and sidebar pieces included; tests/godot holds their GDScript tests.
        run: uvx --from gdtoolkit==4.5.0 gdlint godot_addon/joinery/*.gd tests/godot
      - name: Lint blueprint and feature game code
        run: uvx --from gdtoolkit==4.5.0 gdlint blueprints features
      - name: Play every blueprint and feature in the built engine
        if: runner.os != 'Windows'
        env:
          JOINERY_COMBO_MATRIX: ${{ inputs.combo_matrix == 'full' && 'full' || '' }}
        run: |
          mkdir -p out/native-evidence
          JOINERY_TEST_GODOT="$JOINERY_RELEASE_ENGINE" uv run pytest tests/blueprints tests/test_blueprints.py tests/test_capture_blueprints.py --junitxml=out/native-evidence/blueprints.xml
      - name: Boot the blueprint matrix and keep its report
        if: runner.os == 'Linux'
        run: |
          mkdir -p out/matrix
          JOINERY_TEST_GODOT="$JOINERY_RELEASE_ENGINE" JOINERY_BLUEPRINT_MATRIX=1 JOINERY_MATRIX_REPORT=out/matrix uv run pytest tests/test_blueprint_matrix.py -m blueprint_matrix
      - name: Upload the blueprint matrix report
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blueprint-matrix
          path: out/matrix/matrix.md
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise native controls and real chat pipes
        run: uv run python tests/godot/run_widget_tests.py | tee out/widget-tests.log
      - name: Exercise the Project apps dialog and the app rail
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a uv run python tests/godot/run_setup_tests.py | tee out/setup-tests.log
          else
            uv run python tests/godot/run_setup_tests.py | tee out/setup-tests.log
          fi
      - name: Install the pinned provider for the local API startup fixture
        run: npm install --global --ignore-scripts @openai/codex@0.167.0
      - name: Exercise isolated connection, API and project creation flow
        run: |
          mkdir -p out/native-evidence
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a uv run python tests/godot/run_startup_test.py
          else
            uv run python tests/godot/run_startup_test.py
          fi
      - name: Exercise real graphical editor, review and undo
        run: |
          mkdir -p out/native-evidence
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a uv run python tests/godot/run_scene_edit_test.py | tee out/native-evidence/editor.log
          else
            uv run python tests/godot/run_scene_edit_test.py | tee out/native-evidence/editor.log
          fi
      - name: Switch between Joinery's layout and classic Godot
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a uv run python tests/godot/run_classic_view_test.py --out out/classic-view
          else
            uv run python tests/godot/run_classic_view_test.py --out out/classic-view
          fi
      - name: Capture responsive assistant controls in both themes
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a uv run python tests/godot/run_assistant_ui_test.py | tee out/native-evidence/assistant-ui.log
          else
            uv run python tests/godot/run_assistant_ui_test.py | tee out/native-evidence/assistant-ui.log
          fi
      - name: Require retained framebuffers and the Windows software renderer
        run: |
          uv run python - <<'PY'
          import os
          import struct
          from pathlib import Path
          evidence = Path(os.environ['JOINERY_CAPTURE_DIR'])
          captures = list(evidence.glob('*.png'))
          assert len(captures) >= 3, 'The native harness must retain at least three framebuffers'
          for capture in captures:
              data = capture.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', capture
              assert min(struct.unpack('>II', data[16:24])) > 0, capture
          if os.name == 'nt':
              assert 'llvmpipe' in (evidence / 'editor.log').read_text(encoding='utf-8').lower(), 'Windows must exercise the private Mesa renderer'
          PY
      - name: Install and inspect the pinned Godot MCP on the native host
        run: |
          uv run joinery new out/mcp-check --name "Native MCP check" --tools godot
          uv run joinery mcp install --project out/mcp-check --tool godot
          uv run joinery mcp status --project out/mcp-check --probe | tee out/native-evidence/mcp.json
      - name: Read the release version
        id: release_version
        # Same script as release.yml: maps the package version (0.2.0, 0.2.0a1)
        # to its tag form (0.2.0, 0.2.0-alpha.1) and checks a pushed tag.
        run: |
          uv run python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          match = re.fullmatch(r'(\d+\.\d+\.\d+)(?:(a|b|rc)(\d+))?', version)
          if match is None:
              raise SystemExit(f'pyproject.toml version {version!r} is not a release version (X.Y.Z with an optional aN, bN or rcN)')
          release, stage, number = match.groups()
          stages = {'a': 'alpha', 'b': 'beta', 'rc': 'rc'}
          tag_version = release if stage is None else f'{release}-{stages[stage]}.{number}'
          if os.environ.get('GITHUB_REF_TYPE') == 'tag' and os.environ.get('GITHUB_REF_NAME') != f'v{tag_version}':
              raise SystemExit(f"Tag {os.environ.get('GITHUB_REF_NAME')} does not match package version {version} (expected v{tag_version})")
          lines = f'version={tag_version}\nprerelease={str(stage is not None).lower()}\n'
          if 'GITHUB_OUTPUT' in os.environ:
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
                  output.write(lines)
          print(lines, end='')
          PY
      - name: Package the measured editor without CI graphics DLLs
        env:
          JOINERY_ARCHIVE: out/packages/Joinery-${{ steps.release_version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
        run: |
          uv run joinery package --desktop --binary "$JOINERY_RELEASE_ENGINE" --target "${{ matrix.target }}" --output "$JOINERY_ARCHIVE"
          uv run python release/verify_bundle.py "$JOINERY_ARCHIVE" | tee out/native-evidence/bundle.json
      - name: Export the portable fixture for all desktop runtimes once
        if: runner.os == 'macOS'
        run: uv run python release/export_smoke.py --output out/game-exports --cache "$RUNNER_TEMP/export-templates"
      - name: Upload desktop release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joinery-desktop-${{ matrix.target }}
          path: out/packages/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload portable game exports
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joinery-game-exports
          path: out/game-exports/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain native logs and checked framebuffer captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joinery-native-evidence-${{ matrix.target }}
          path: |
            out/build-engine.json
            out/widget-tests.log
            out/native-evidence/
            out/windows-software-gl/mesa-ci.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save successful compiler work even if a later gate failed
        if: ${{ always() && steps.native_build.outcome == 'success' && steps.compiler_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/joinery/scons
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}

  runtime:
    needs: editor
    if: ${{ inputs.runtimes }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --python 3.12
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: joinery-game-exports
          path: out/game-exports
      - name: Run the exported scene on its native operating system
        run: uv run python release/export_smoke.py --output out/game-exports --smoke-only
