[project]
name = "joinery"
version = "0.0.0"
description = "Godot-based engine directed through real creative tools. Creation, not generation."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["godot_patches/godot-src"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
