[project]
name = "joinery"
version = "0.6.0"
description = "Godot-based engine directed through real creative tools. Creation, not generation."
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "pydantic",
    "sigstore==4.5.1",
]

[project.scripts]
joinery = "joinery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joinery", "bridge", "servers"]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "scons==4.11.1",
    "types-jsonschema==4.26.0.20261006",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["godot_patches/godot-src"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "blueprint_matrix: every blueprint x feature set played in stock Godot (slow; JOINERY_BLUEPRINT_MATRIX=1 or -m blueprint_matrix)",
    "playtest_slow: two-minute headless playtests of every blueprint with every feature (slow; JOINERY_PLAYTEST_SLOW=1)",
]
