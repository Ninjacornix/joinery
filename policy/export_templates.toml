# The one Godot export-template release Joinery exports games with: the
# official 4.7.2 templates, matching the engine base (godot_patches/UPSTREAM).
# `joinery share build` and the release checks (release/export_smoke.py) read
# this file, so the pin lives in one place. See docs/adr/0046-share-your-game.md.
#
# The archive is 1.2 GB. Joinery downloads it only when the user asks
# (`joinery share build --download-templates`, or the Download button on the
# Share page), never on its own. A copy already on disk is used when its
# SHA-512 matches, and so are templates installed by Godot's own template
# manager when each file's SHA-256 below matches.
#
# Change it only through a reviewed change: download the new release once,
# record its SHA-512 and the SHA-256 of every file listed under [files].

version = "4.7.2.stable"
url = "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
