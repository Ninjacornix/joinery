  "thuanlm215/krita-mcp: 6 stars",
]

[[tool]]
id = "surge-xt"
name = "Surge XT"
domain = "audio"
status = "available"
builtin_server = "joinery-sound"
candidates = ["redsquidleader/surge-xt-mcp: 1 star"]
# Joinery's sound server renders Surge XT 1.3.4 (pinned stable release) offline
# through its real VST3 in the creative worker. See docs/adr/0021-surge-xt.md.

[[tool]]
id = "audacity"
name = "Audacity"
domain = "audio"
status = "available"
[tool.mcp]
server = "audacity"
repo = "https://github.com/xDarkzx/Audacity-MCP"
ref = "2835f96c18934fe93b0b0673ba18fc88d884a12b"
tier = "community"
stars = 133
last_push = 2026-10-31
licence = "Apache-2.0"
# Speech-to-text runs a downloaded model (faster-whisper), which Rule Zero
# keeps out: the worker never installs it, and a call to one of these tools
# stops the turn so the user is told.
generative_tools = [
  "transcribe_audio",
  "transcribe_selection",
  "transcribe_to_file",
  "transcribe_to_labels",
  "transcription_set_model",
  "check_transcription_status",
  "get_default_transcription_folder",
]
notes = "Audacity 3.7.3 in its own offline worker (docs/adr/0082-audacity-worker.md). Kept edits go through joinery-sound operate_document, whose typed steps are recorded and replayed exactly. This MCP is for inspection; its transcription tools need a speech model, and calling one stops the turn (Rule Zero)."

[[tool]]
id = "material-maker"
name = "Material Maker"
domain = "materials"
status = "available"
builtin_server = "joinery-materialmaker"
candidates = [
  "graysonchalmers/Tool-MaterialMaker-MCP: base for our hardened fork, MIT, no telemetry, 10 stars, self-described alpha",
