# Preferred tools shown in project setup. Add a future tool by appending a [[tool]];
# `joinery check catalog` enforces the bar in joinery/catalog.py. Preferred MCPs must be
# non-generative and send no telemetry. Users may add anything else per project,
# including tools that send telemetry: that is their choice.
# Stars and dates are a snapshot from `vetted_on`. Each ref had its source scanned for
# telemetry, generative services and outbound calls. Any new ref means re-vetting.

vetted_on = 2026-11-07
# Aseprite, REAPER and MuseScore were removed (docs/adr/0025-tool-removals.md);
# Audacity came back in its own worker (docs/adr/0082-audacity-worker.md).
# joinery/catalog.py REMOVED_TOOLS tells projects that still enable them.

# Joinery's own servers, always allowed.
builtin_servers = [
  "joinery-registry",
  "joinery-verify",
  "joinery-blender-ops",
  "joinery-materialmaker",
  "joinery-paint",
  "joinery-sound",
]

[[tool]]
id = "godot"
name = "Godot"
domain = "engine"
required = true
status = "available"
[tool.mcp]
server = "godot"
repo = "https://github.com/tugcantopaloglu/godot-mcp"
ref = "88f0fbc69a08225d4fdec32f921209e127f52395"
tier = "community"
stars = 510
last_push = 2026-10-09
licence = "MIT"
blocked_tools = ["game_http_request"]
notes = "game_http_request is a generic network escape, so it stays blocked."

[[tool]]
id = "blender"
name = "Blender"
domain = "3d"
also_domains = ["materials"]
status = "available"
[tool.mcp]
server = "blender"
repo = "https://projects.blender.org/lab/blender_mcp"
ref = "2cea8d566dde07fbac28a61d698909d69724e853"
tier = "official"
stars = 37
last_push = 2026-09-29
licence = "GPL-3.0-or-later"
# These read or drive Blender's window, which the offline worker never opens:
# each returns "not available in background mode". Viewport and thumbnail
# renders still work.
blocked_tools = [
  "get_screenshot_of_area_as_image",
  "get_screenshot_of_window_as_image",
  "get_screenshot_of_window_as_json",
  "jump_to_tab_by_name",
  "jump_to_tab_by_space_type",
  "jump_to_view3d_object_by_name",
  "jump_to_view3d_object_data_by_name",
]
notes = "v1.0.3, needs Blender 5.1+. Runs LLM code unguarded, so use it only inside the sandbox. Materials via shader nodes and bake. Window-only tools are blocked because the worker runs Blender in the background."

[[tool]]
id = "supercollider"
name = "SuperCollider"
domain = "audio"
status = "available"
[tool.mcp]
server = "claude-collider"
repo = "https://github.com/jeremyruppel/claude-collider"
ref = "467fac4eb5bbb6e1c00c259e4da9fbc275734bf9"
tier = "community"
stars = 61
last_push = 2026-11-01
licence = "MIT"

[[tool]]
id = "gimp"
name = "GIMP"
domain = "2d"
status = "available"
builtin_server = "joinery-paint"
# GIMP 3 runs headless in the creative worker. Joinery's own paint server edits
# .xcf documents through its Python-Fu adapter (joinery/tools/gimp.py). The
# community gimp-mcp needs a live desktop GIMP, so it is no longer pinned.

[[tool]]
id = "inkscape"
name = "Inkscape"
domain = "2d"
status = "available"
[tool.mcp]
server = "inkscape"
repo = "https://github.com/aravindev/inkscape_mcp"
ref = "5a53f769fc33a5c3b5e6e7049797d74bcb67bc51"
tier = "community"
stars = 92
last_push = 2026-11-02
licence = "MIT"
blocked_tools = ["inkscape_live"]
blocked_operations = ["inkscape_extension:run_live"]
notes = "For inspection, analysis and conversion. Persistent SVG edits go through joinery-paint operate_vector so they get a recipe. inkscape_live and extension run_live need the Inkscape desktop app over D-Bus, which the offline worker never has."

# Joinery's own servers drive these programs in its offline workers.

[[tool]]
id = "krita"
name = "Krita"
domain = "2d"
status = "available"
builtin_server = "joinery-paint"
candidates = [
  "nanayax3/krita-mcp: 52 stars, last push 2026-02-26, stale",
