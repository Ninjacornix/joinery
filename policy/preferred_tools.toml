# Preferred tools shown in project setup. Add a future tool by appending a [[tool]];
# `joinery check catalog` enforces the bar in joinery/catalog.py. Preferred MCPs must be
# non-generative and send no telemetry. Users may add anything else per project,
# including tools that send telemetry: that is their choice.
# Stars and dates are a snapshot from `vetted_on`. Each ref had its source scanned for
# telemetry, generative services and outbound calls. Any new ref means re-vetting.

vetted_on = 2026-11-07

# Joinery's own servers, always allowed.
builtin_servers = [
  "joinery-registry",
  "joinery-verify",
  "joinery-blender-ops",
  "joinery-materialmaker",
  "joinery-paint",
  "joinery-sound",
]

[[tool]]
id = "godot"
name = "Godot"
domain = "engine"
required = true
status = "available"
[tool.mcp]
server = "godot"
repo = "https://github.com/tugcantopaloglu/godot-mcp"
ref = "88f0fbc69a08225d4fdec32f921209e127f52395"
tier = "community"
stars = 510
last_push = 2026-10-09
licence = "MIT"
blocked_tools = ["game_http_request"]
notes = "game_http_request is a generic network escape, so it stays blocked."

