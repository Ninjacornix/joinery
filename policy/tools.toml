# Tools offered in the install menu. Add a future tool by appending a [[tool]];
# `joinery check catalog` enforces the admission bar in joinery/catalog.py.
# Stars and dates are a snapshot from `vetted_on`. Vetting covered repo metadata and
# READMEs, not a full source audit. Any source change means re-vetting and a new ref.

vetted_on = 2026-11-07

# Joinery's own servers, always allowed.
builtin_servers = [
  "joinery-registry",
  "joinery-verify",
  "joinery-blender-ops",
  "joinery-materialmaker",
  "joinery-paint",
  "joinery-sound",
]

[[tool]]
id = "godot"
name = "Godot"
domain = "engine"
required = true
status = "available"
[tool.mcp]
server = "godot"
repo = "https://github.com/hi-godot/godot-ai"
ref = "643c64f3edf984a9668b3043f4d20ebb2bbec6b6"
tier = "community"
stars = 3428
last_push = 2026-11-06
licence = "MIT"
notes = "Sends anonymous telemetry unless GODOT_AI_DISABLE_TELEMETRY=true is set; set it."

